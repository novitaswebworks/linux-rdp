name: linux + tailscale + Download script

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install Desktop Environment & XRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            xorgxrdp \
            curl \
            net-tools

          # Configure XRDP default session to XFCE
          echo "xfce4-session" | sudo tee /etc/skel/.xsession
          sudo adduser xrdp ssl-cert

          # Start and enable XRDP service on port 3389
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Create RDP User with Fixed Password
        run: |
          PASSWORD="MR.English2008"
          USER_NAME="RDP"

          # Create user RDP if it does not exist
          if ! id "$USER_NAME" &>/dev/null; then
            sudo useradd -m -s /bin/bash "$USER_NAME"
          fi

          # Set password and assign sudo permissions
          echo "$USER_NAME:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$USER_NAME"

          # Configure user's X session
          echo "xfce4-session" | sudo tee /home/$USER_NAME/.xsession
          sudo chown $USER_NAME:$USER_NAME /home/$USER_NAME/.xsession

          echo "RDP_CREDS=User: $USER_NAME | Password: $PASSWORD" >> $GITHUB_ENV
          echo "RDP_USER=$USER_NAME" >> $GITHUB_ENV
          echo "RDP_PASS=$PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} \
            --hostname=gh-runner-linux-$GITHUB_RUN_ID \
            --accept-routes

          # Wait for Tailscale to assign an IPv4
          TS_IP=""
          for i in {1..10}; do
            TS_IP=$(tailscale ip -4 || true)
            if [ -n "$TS_IP" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "::error::Tailscale IP not assigned. Exiting."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"

          # Test connectivity against local port 3389
          if nc -z -w5 127.0.0.1 3389; then
            echo "TCP connectivity to RDP port 3389 successful!"
          else
            echo "::error::TCP connection to RDP port 3389 failed"
            exit 1
          fi

      - name: Maintain Connection + Watch RDP User
        run: |
          echo ""
          echo "=== RDP ACCESS ==="
          echo "Address: $TAILSCALE_IP:3389"
          echo "Username: $RDP_USER"
          echo "Password: $RDP_PASS"
          echo "=================="
          echo ""

          # Download and execute custom startup script if available
          DOWNLOAD_URL="https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          STARTUP_DIR="/home/$RDP_USER/Desktop"
          sudo mkdir -p "$STARTUP_DIR"
          sudo curl -fsSL "$DOWNLOAD_URL" -o "$STARTUP_DIR/Downloads.bat" || true
          sudo chown -R $RDP_USER:$RDP_USER "/home/$RDP_USER"

          # Keep runner alive
          while true; do
            echo "[$(date)] RDP Active - Use Ctrl+C in workflow to terminate"
            sleep 300
          done
