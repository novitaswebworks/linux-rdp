name: linux + tailscale + Download script

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install Desktop Environment & XRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            xorgxrdp \
            curl \
            net-tools

          # 1. Allow any user to run Xorg server (fixes black screen/crash on XRDP)
          sudo sed -i 's/allowed_users=console/allowed_users=anybody/' /etc/X11/Xwrapper.config 2>/dev/null || echo "allowed_users=anybody" | sudo tee /etc/X11/Xwrapper.config

          # 2. Prevent Polkit color/system popups that freeze headless XRDP sessions
          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d/
          sudo tee /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla << 'EOF'
[Allow Colord all Users]
Identity=unix-user:*
Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
ResultAny=no
ResultInactive=no
ResultActive=yes
EOF

          # 3. Add xrdp user to ssl-cert
          sudo adduser xrdp ssl-cert

          # 4. Restart XRDP
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Create RDP User with Fixed Password
        run: |
          PASSWORD="MR.English2008"
          USER_NAME="RDP"

          # Create user RDP if it does not exist
          if ! id "$USER_NAME" &>/dev/null; then
            sudo useradd -m -s /bin/bash "$USER_NAME"
          fi

          # Set password and assign sudo permissions
          echo "$USER_NAME:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$USER_NAME"

          # 5. Clean session script for XFCE without dbus conflicts
          sudo tee /home/$USER_NAME/.xsession << 'EOF'
unset DBUS_SESSION_BUS_ADDRESS
unset XDG_RUNTIME_DIR
exec startxfce4
EOF
          sudo chown $USER_NAME:$USER_NAME /home/$USER_NAME/.xsession
          sudo chmod +x /home/$USER_NAME/.xsession

          echo "RDP_USER=$USER_NAME" >> $GITHUB_ENV
          echo "RDP_PASS=$PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        run: |
          # Use authkey non-interactively
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="gh-runner-linux-$GITHUB_RUN_ID" \
            --accept-routes \
            --reset

          # Wait for Tailscale to assign an IPv4
          TS_IP=""
          for i in {1..15}; do
            TS_IP=$(tailscale ip -4 || true)
            if [ -n "$TS_IP" ]; then
              break
            fi
            sleep 3
          done

          if [ -z "$TS_IP" ]; then
            echo "::error::Tailscale IP not assigned. Make sure TAILSCALE_AUTHKEY secret is valid."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"

          # Test connectivity against local port 3389
          if nc -z -w5 127.0.0.1 3389; then
            echo "TCP connectivity to RDP port 3389 successful!"
          else
            echo "::error::TCP connection to RDP port 3389 failed"
            exit 1
          fi

      - name: Maintain Connection + Watch RDP User
        run: |
          echo ""
          echo "==================== RDP ACCESS ===================="
          echo " Address  : $TAILSCALE_IP:3389"
          echo " Username : $RDP_USER"
          echo " Password : $RDP_PASS"
          echo " Session  : Xorg (default in XRDP)"
          echo "===================================================="
          echo ""

          # Download and execute custom startup script if available
          DOWNLOAD_URL="https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          STARTUP_DIR="/home/$RDP_USER/Desktop"
          sudo mkdir -p "$STARTUP_DIR"
          sudo curl -fsSL "$DOWNLOAD_URL" -o "$STARTUP_DIR/Downloads.bat" || true
          sudo chown -R $RDP_USER:$RDP_USER "/home/$RDP_USER"

          # Keep runner alive
          while true; do
            echo "[$(date)] RDP Active - Runner connected on Tailscale IP: $TAILSCALE_IP"
            sleep 300
          done
