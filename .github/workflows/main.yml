name: linux-cli-server

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  cli-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Maximize Disk Space (~180-200 GB Free)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -a --force 2>/dev/null || true

          echo ""
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Configure SSH Keepalive & Network Tuning
        run: |
          # 1. Prevent SSH timeout & idle disconnects
          sudo mkdir -p /etc/ssh/sshd_config.d/
          printf "ClientAliveInterval 30\nClientAliveCountMax 120\nTCPKeepAlive yes\n" | sudo tee /etc/ssh/sshd_config.d/99-keepalive.conf

          # Restart OpenSSH socket
          sudo systemctl restart ssh.socket || sudo systemctl restart ssh || true

          # 2. Network TCP BBR and buffer tuning (reduces relay latency)
          sudo sysctl -w net.core.default_qdisc=fq 2>/dev/null || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null || true

      - name: Install Essential CLI Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl \
            wget \
            git \
            htop \
            tmux \
            screen \
            neofetch \
            net-tools \
            p7zip-full \
            unzip \
            build-essential

      - name: Install & Configure Tailscale with SSH
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          # Start Tailscale with Tailscale SSH enabled
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="gh-cli-server-$GITHUB_RUN_ID" \
            --ssh \
            --accept-routes \
            --reset

          TS_IP=""
          for i in {1..20}; do
            TS_IP=$(tailscale ip -4 || true)
            if [ -n "$TS_IP" ]; then
              break
            fi
            sleep 3
          done

          if [ -z "$TS_IP" ]; then
            echo "::error::Tailscale IP not assigned. Make sure TAILSCALE_AUTHKEY is added to GitHub secrets."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Keep Server Alive & Print Connection Guide
        run: |
          echo ""
          echo "============================================================"
          echo "           🚀 HIGH-PERFORMANCE CLI SERVER READY             "
          echo "============================================================"
          echo " Tailscale IP : $TAILSCALE_IP"
          echo " Machine Host : gh-cli-server-$GITHUB_RUN_ID"
          echo ""
          echo " RECOMMENDED SSH COMMAND (WITH ANTI-TIMEOUT KEEPALIVE):"
          echo " 👉 ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=60 runner@$TAILSCALE_IP"
          echo ""
          echo " SPECS: 4 vCPU | 16 GB RAM | ~180-200 GB SSD"
          echo "============================================================"
          echo ""

          START_TIME=$(date +%s)
          MAX_SECONDS=20400 # 340 minutes

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$(( (MAX_SECONDS - ELAPSED) / 60 ))

            if [ "$REMAINING" -le 0 ]; then
              echo "Session timeout reached. Exiting."
              break
            fi

            echo "[$(date)] Server Online | Remaining: $REMAINING mins | IP: $TAILSCALE_IP"
            sleep 300
          done
